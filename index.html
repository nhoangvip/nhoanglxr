<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tool Box | 777 Access</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, 'Inter', sans-serif;
      background: radial-gradient(circle at 20% 20%, #0a0f1e, #03050a);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      margin: 0;
      transition: background 0.4s ease;
    }

    /* Container chính */
    .app-container {
      width: 100%;
      max-width: 500px;
      background: rgba(12, 18, 28, 0.8);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(0, 255, 196, 0.2);
      box-shadow: 0 30px 50px rgba(0, 180, 255, 0.15), 0 0 0 1px rgba(0, 255, 200, 0.1);
      border-radius: 2.5rem;
      padding: 2rem 1.8rem;
      transition: all 0.35s cubic-bezier(0.23, 1, 0.32, 1);
      color: #e3f2ff;
    }

    /* Ẩn/hiện màn hình */
    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1.8rem;
      width: 100%;
    }

    .screen.active {
      display: flex;
    }

    /* Tiêu đề */
    .title {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #a0f0ff, #4affc1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 15px rgba(0,255,200,0.5);
      margin-bottom: 0.2rem;
    }

    .subtitle {
      color: #8ea9c9;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* Ô nhập mật khẩu */
    .password-input {
      background: rgba(0, 20, 30, 0.7);
      border: 1.5px solid rgba(74, 255, 195, 0.3);
      border-radius: 3rem;
      padding: 0.9rem 1.8rem;
      width: 100%;
      font-size: 1.4rem;
      font-weight: 600;
      text-align: center;
      letter-spacing: 6px;
      color: #d4ffea;
      outline: none;
      transition: all 0.25s;
      backdrop-filter: blur(10px);
    }

    .password-input:focus {
      border-color: #4affc1;
      box-shadow: 0 0 25px rgba(74, 255, 195, 0.5);
    }

    .password-input::placeholder {
      color: rgba(180, 220, 255, 0.4);
      letter-spacing: 3px;
      font-size: 1rem;
    }

    .btn {
      background: rgba(20, 35, 50, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(74, 255, 200, 0.4);
      padding: 0.9rem 2.2rem;
      border-radius: 3rem;
      font-weight: 600;
      font-size: 1.1rem;
      letter-spacing: 1px;
      color: #ccf0ff;
      cursor: pointer;
      transition: 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: fit-content;
      min-width: 160px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      text-transform: uppercase;
    }

    .btn-primary {
      background: linear-gradient(145deg, #0b3440, #021a24);
      border-color: #2ef7b0;
      color: #e0fff0;
      font-weight: 700;
      box-shadow: 0 0 18px rgba(0, 255, 180, 0.4);
    }

    .btn-primary:hover {
      background: #0a4050;
      border-color: #7effdb;
      box-shadow: 0 0 28px #1effbc;
      transform: scale(1.02);
    }

    .btn:active {
      transform: scale(0.96);
    }

    .error-message {
      color: #ff7c8c;
      font-size: 0.9rem;
      font-weight: 500;
      min-height: 1.5rem;
      letter-spacing: 0.4px;
    }

    /* Dashboard */
    .feature-grid {
      display: flex;
      flex-direction: column;
      gap: 1.4rem;
      width: 100%;
      margin: 1rem 0 0.5rem;
    }

    .feature-card {
      background: rgba(8, 20, 33, 0.55);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(64, 224, 208, 0.18);
      border-radius: 2rem;
      padding: 1.2rem 1.4rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.3s ease;
      box-shadow: 0 10px 20px -8px rgba(0,0,0,0.6);
    }

    .feature-info {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .feature-name {
      font-weight: 700;
      font-size: 1.35rem;
      letter-spacing: 1px;
      background: linear-gradient(to right, #c6ffff, #8fffe0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .feature-desc {
      font-size: 0.75rem;
      color: #99b5d4;
      letter-spacing: 0.4px;
    }

    .toggle-area {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    /* Nút bật tắt */
    .switch {
      position: relative;
      display: inline-block;
      width: 62px;
      height: 32px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #1d3148;
      border-radius: 34px;
      transition: 0.25s;
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: inset 0 1px 4px rgba(0,0,0,0.6);
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 24px;
      width: 24px;
      left: 4px;
      bottom: 3px;
      background: #d4eaff;
      transition: 0.25s;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }

    input:checked + .slider {
      background: #0fe4a7;
      box-shadow: 0 0 18px #1effbc;
    }

    input:checked + .slider:before {
      transform: translateX(28px);
      background: #ffffff;
      box-shadow: 0 0 12px white;
    }

    /* Hiệu ứng chờ kích hoạt */
    .activating-effect {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.8rem;
      color: #f5e56c;
      font-weight: 600;
      background: rgba(0,0,0,0.4);
      padding: 0.25rem 0.8rem;
      border-radius: 2rem;
      margin-left: 0.3rem;
      backdrop-filter: blur(4px);
      animation: pulseGlow 0.9s infinite;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid #ffe484;
      border-top: 2px solid transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulseGlow {
      0% { opacity: 0.8; box-shadow: 0 0 5px gold; }
      50% { opacity: 1; box-shadow: 0 0 18px #ffbb2e; }
      100% { opacity: 0.8; box-shadow: 0 0 5px gold; }
    }

    .disabled-switch {
      opacity: 0.5;
      pointer-events: none;
      filter: grayscale(0.4);
    }

    .logout-btn {
      margin-top: 0.8rem;
      background: transparent;
      border: 1px solid #4a5c74;
      color: #b0c7e0;
      font-size: 0.85rem;
      padding: 0.5rem 1.8rem;
    }

    .status-badge {
      font-size: 0.8rem;
      background: #0b1b2b;
      padding: 0.2rem 1rem;
      border-radius: 20px;
      color: #9edfff;
    }

    /* Responsive nhẹ */
    @media (max-width: 400px) {
      .app-container {
        padding: 1.5rem 1.2rem;
      }
      .feature-name {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <div class="app-container" id="appContainer">
    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="loginScreen" class="screen active">
      <div style="font-size: 2.8rem; margin-bottom: 0.2rem;">🔐</div>
      <div class="title">APP HỖ TRỢ KÉO TÂM</div>
      <div class="subtitle">v2.4 · Nguyen Hoang</div>
      <input type="password" id="passwordInput" class="password-input" placeholder="····" maxlength="10" inputmode="numeric" autofocus>
      <div class="error-message" id="errorMsg"></div>
      <button class="btn btn-primary" id="loginBtn">
        <span>▶</span> TRUY CẬP
      </button>
      <div style="font-size: 0.7rem; color: #5f7a9a; margin-top: 0.5rem;">nhập mã bí mật</div>
    </div>

    <!-- MÀN HÌNH CHỨC NĂNG (DASHBOARD) -->
    <div id="dashboardScreen" class="screen">
      <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
        <span class="title" style="font-size: 1.9rem;">⚡ CONTROL</span>
        <span class="status-badge" id="activeStatus">🛡️ SẴN SÀNG</span>
      </div>
      <div class="subtitle" style="margin-bottom: 0.2rem;">chỉ kích hoạt 1 chức năng</div>

      <div class="feature-grid">
        <!-- AIMLOCK -->
        <div class="feature-card" id="cardAimlock">
          <div class="feature-info">
            <span class="feature-name">🎯 AIMLOCK</span>
            <span class="feature-desc">Khóa mục tiêu chính xác</span>
          </div>
          <div class="toggle-area">
            <div id="aimlockActivating" style="display: none;" class="activating-effect">
              <span class="spinner"></span> kích hoạt
            </div>
            <label class="switch" id="switchAimlockLabel">
              <input type="checkbox" id="toggleAimlock">
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <!-- NHẸ TÂM -->
        <div class="feature-card" id="cardNheTam">
          <div class="feature-info">
            <span class="feature-name">💣 NHẸ TÂM</span>
            <span class="feature-desc">Hỗ trợ nhẹ</span>
          </div>
          <div class="toggle-area">
            <div id="nhetamActivating" style="display: none;" class="activating-effect">
              <span class="spinner"></span> kích hoạt
            </div>
            <label class="switch" id="switchNheTamLabel">
              <input type="checkbox" id="toggleNheTam">
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <!-- AIM SAFE -->
        <div class="feature-card" id="cardAimSafe">
          <div class="feature-info">
            <span class="feature-name">🛡️ AIM SAFE</span>
            <span class="feature-desc">An toàn, không bị phát hiện</span>
          </div>
          <div class="toggle-area">
            <div id="aimsafeActivating" style="display: none;" class="activating-effect">
              <span class="spinner"></span> kích hoạt
            </div>
            <label class="switch" id="switchAimSafeLabel">
              <input type="checkbox" id="toggleAimSafe">
              <span class="slider"></span>
            </label>
          </div>
        </div>
      </div>

      <button class="btn logout-btn" id="logoutBtn">
        <span>↩️</span> ĐĂNG XUẤT
      </button>
      <div style="font-size: 0.65rem; color: #4b637c; margin-top: 0.2rem;">FPS ổn định · phản hồi mượt</div>
    </div>
  </div>

  <script>
    (function() {
      // ---- MẬT KHẨU ----
      const SECRET_PASSWORD = "777";
      
      // ---- TRẠNG THÁI ----
      let currentActiveFeature = null; // 'aimlock', 'nhetam', 'aimsafe' hoặc null
      let activationTimer = null;
      let isActivating = false; // đang trong quá trình chờ 1s

      // ---- DOM Elements ----
      const loginScreen = document.getElementById('loginScreen');
      const dashboardScreen = document.getElementById('dashboardScreen');
      const passwordInput = document.getElementById('passwordInput');
      const loginBtn = document.getElementById('loginBtn');
      const errorMsg = document.getElementById('errorMsg');
      const logoutBtn = document.getElementById('logoutBtn');
      const activeStatus = document.getElementById('activeStatus');

      // Toggle inputs
      const toggleAimlock = document.getElementById('toggleAimlock');
      const toggleNheTam = document.getElementById('toggleNheTam');
      const toggleAimSafe = document.getElementById('toggleAimSafe');

      // Labels để disable switch
      const switchAimlockLabel = document.getElementById('switchAimlockLabel');
      const switchNheTamLabel = document.getElementById('switchNheTamLabel');
      const switchAimSafeLabel = document.getElementById('switchAimSafeLabel');

      // Hiệu ứng activating
      const aimlockActivating = document.getElementById('aimlockActivating');
      const nhetamActivating = document.getElementById('nhetamActivating');
      const aimsafeActivating = document.getElementById('aimsafeActivating');

      // Cards để thay đổi style khi active
      const cardAimlock = document.getElementById('cardAimlock');
      const cardNheTam = document.getElementById('cardNheTam');
      const cardAimSafe = document.getElementById('cardAimSafe');

      // ---- HÀM HỖ TRỢ ----
      function clearAllTogglesExcept(feature) {
        // Tắt tất cả toggle, ngoại trừ feature được chỉ định (nếu có)
        if (feature !== 'aimlock') toggleAimlock.checked = false;
        if (feature !== 'nhetam') toggleNheTam.checked = false;
        if (feature !== 'aimsafe') toggleAimSafe.checked = false;
      }

      function updateUIForActiveFeature(feature) {
        // Xóa hiệu ứng active trên tất cả card
        cardAimlock.style.border = '1px solid rgba(64, 224, 208, 0.18)';
        cardNheTam.style.border = '1px solid rgba(64, 224, 208, 0.18)';
        cardAimSafe.style.border = '1px solid rgba(64, 224, 208, 0.18)';
        
        if (feature === 'aimlock') {
          cardAimlock.style.border = '2px solid #0fe4a7';
          cardAimlock.style.boxShadow = '0 0 22px #1effbc';
          activeStatus.innerHTML = '🎯 AIMLOCK ACTIVE';
        } else if (feature === 'nhetam') {
          cardNheTam.style.border = '2px solid #0fe4a7';
          cardNheTam.style.boxShadow = '0 0 22px #1effbc';
          activeStatus.innerHTML = '🧘 NHẸ TÂM ACTIVE';
        } else if (feature === 'aimsafe') {
          cardAimSafe.style.border = '2px solid #0fe4a7';
          cardAimSafe.style.boxShadow = '0 0 22px #1effbc';
          activeStatus.innerHTML = '🛡️ AIM SAFE ACTIVE';
        } else {
          activeStatus.innerHTML = '🛡️ SẴN SÀNG';
        }
      }

      function setSwitchesEnabled(enabled) {
        // Nếu đang kích hoạt thì không cho phép thay đổi switch khác
        if (enabled && isActivating) {
          // Khi đang kích hoạt, tạm khoá tất cả switch (trừ switch đang trong tiến trình? vẫn khoá hết)
          switchAimlockLabel.classList.add('disabled-switch');
          switchNheTamLabel.classList.add('disabled-switch');
          switchAimSafeLabel.classList.add('disabled-switch');
          return;
        }
        
        if (enabled) {
          switchAimlockLabel.classList.remove('disabled-switch');
          switchNheTamLabel.classList.remove('disabled-switch');
          switchAimSafeLabel.classList.remove('disabled-switch');
        } else {
          switchAimlockLabel.classList.add('disabled-switch');
          switchNheTamLabel.classList.add('disabled-switch');
          switchAimSafeLabel.classList.add('disabled-switch');
        }
      }

      function hideAllActivatingEffects() {
        aimlockActivating.style.display = 'none';
        nhetamActivating.style.display = 'none';
        aimsafeActivating.style.display = 'none';
      }

      // Hủy timer nếu có
      function cancelActivation() {
        if (activationTimer) {
          clearTimeout(activationTimer);
          activationTimer = null;
        }
        isActivating = false;
        hideAllActivatingEffects();
        setSwitchesEnabled(true);
      }

      // Xử lý khi chọn 1 tính năng (bật)
      function activateFeature(feature) {
        // Nếu đang có kích hoạt khác, hủy
        cancelActivation();
        
        // Nếu tính năng hiện tại đã active, không làm gì (hoặc tắt? nhưng yêu cầu chỉ bật 1, nên nếu bấm vào đang active thì có thể tắt)
        if (currentActiveFeature === feature) {
          // Tắt nó đi
          clearAllTogglesExcept(null);
          currentActiveFeature = null;
          updateUIForActiveFeature(null);
          hideAllActivatingEffects();
          setSwitchesEnabled(true);
          return;
        }

        // Bắt đầu quá trình kích hoạt 1 giây
        isActivating = true;
        // Vô hiệu hóa tất cả switch trong lúc chờ
        setSwitchesEnabled(false);
        
        // Hiển thị hiệu ứng chờ tương ứng
        hideAllActivatingEffects();
        if (feature === 'aimlock') {
          aimlockActivating.style.display = 'flex';
        } else if (feature === 'nhetam') {
          nhetamActivating.style.display = 'flex';
        } else if (feature === 'aimsafe') {
          aimsafeActivating.style.display = 'flex';
        }

        // Clear tất cả toggle khác, chỉ bật toggle của feature này (sẽ update sau khi timer chạy xong)
        clearAllTogglesExcept(feature);
        // Đảm bảo toggle của feature được bật (vì clearAllTogglesExcept giữ lại feature)
        if (feature === 'aimlock') toggleAimlock.checked = true;
        if (feature === 'nhetam') toggleNheTam.checked = true;
        if (feature === 'aimsafe') toggleAimSafe.checked = true;

        // Timer 1 giây
        activationTimer = setTimeout(() => {
          // Kích hoạt hoàn tất
          currentActiveFeature = feature;
          updateUIForActiveFeature(feature);
          hideAllActivatingEffects();
          isActivating = false;
          setSwitchesEnabled(true);
          activationTimer = null;
          
          // Đảm bảo toggle đúng trạng thái (chỉ feature này bật)
          clearAllTogglesExcept(feature);
          if (feature === 'aimlock') toggleAimlock.checked = true;
          if (feature === 'nhetam') toggleNheTam.checked = true;
          if (feature === 'aimsafe') toggleAimSafe.checked = true;
        }, 1000); // đúng 1 giây
      }

      // Xử lý khi người dùng nhấn toggle (on/off)
      function handleToggleChange(feature, isChecked) {
        // Nếu đang trong quá trình kích hoạt, ngăn thay đổi
        if (isActivating) {
          // Khôi phục trạng thái toggle về trước đó (dựa vào currentActiveFeature)
          if (feature === 'aimlock') toggleAimlock.checked = (currentActiveFeature === 'aimlock');
          if (feature === 'nhetam') toggleNheTam.checked = (currentActiveFeature === 'nhetam');
          if (feature === 'aimsafe') toggleAimSafe.checked = (currentActiveFeature === 'aimsafe');
          return;
        }

        if (isChecked) {
          // Bật tính năng này -> gọi activateFeature
          activateFeature(feature);
        } else {
          // Tắt tính năng (chỉ khi nó đang là active)
          if (currentActiveFeature === feature) {
            cancelActivation();
            clearAllTogglesExcept(null);
            currentActiveFeature = null;
            updateUIForActiveFeature(null);
            hideAllActivatingEffects();
            setSwitchesEnabled(true);
          } else {
            // Nếu không phải active, chỉ cần đảm bảo toggle tắt (trường hợp hiếm)
            if (feature === 'aimlock') toggleAimlock.checked = false;
            if (feature === 'nhetam') toggleNheTam.checked = false;
            if (feature === 'aimsafe') toggleAimSafe.checked = false;
          }
        }
      }

      // ---- GÁN SỰ KIỆN TOGGLE ----
      toggleAimlock.addEventListener('change', (e) => {
        handleToggleChange('aimlock', e.target.checked);
      });
      toggleNheTam.addEventListener('change', (e) => {
        handleToggleChange('nhetam', e.target.checked);
      });
      toggleAimSafe.addEventListener('change', (e) => {
        handleToggleChange('aimsafe', e.target.checked);
      });

      // ---- ĐĂNG NHẬP ----
      function attemptLogin() {
        const entered = passwordInput.value.trim();
        if (entered === SECRET_PASSWORD) {
          errorMsg.textContent = '';
          // Chuyển màn hình
          loginScreen.classList.remove('active');
          dashboardScreen.classList.add('active');
          // Reset trạng thái dashboard
          cancelActivation();
          clearAllTogglesExcept(null);
          currentActiveFeature = null;
          updateUIForActiveFeature(null);
          setSwitchesEnabled(true);
          hideAllActivatingEffects();
          // Focus nhẹ
        } else {
          errorMsg.textContent = '❌ Mã không đúng. Vui lòng thử lại.';
          passwordInput.value = '';
          passwordInput.focus();
        }
      }

      loginBtn.addEventListener('click', attemptLogin);
      passwordInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          attemptLogin();
        }
      });

      // Đăng xuất
      logoutBtn.addEventListener('click', () => {
        cancelActivation();
        clearAllTogglesExcept(null);
        currentActiveFeature = null;
        updateUIForActiveFeature(null);
        hideAllActivatingEffects();
        setSwitchesEnabled(true);
        
        dashboardScreen.classList.remove('active');
        loginScreen.classList.add('active');
        passwordInput.value = '';
        errorMsg.textContent = '';
        passwordInput.focus();
      });

      // Khởi tạo ban đầu: đảm bảo switch hoạt động
      setSwitchesEnabled(true);
      
      // Ngăn chặn hành vi không mong muốn khi click vào label disabled (nhưng đã xử lý bằng class)
      // Thêm một chút mượt mà: preload font, tối ưu repaint
      console.log('🔒 Toolbox sẵn sàng - yêu cầu 60fps, hiệu ứng kích hoạt 1s.');
    })();
  </script>
</body>
</html>
